name: KE-complex_modifications-core CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: tests
        run: make -C tests
      - name: enable pnpm
        run: corepack enable
      - name: install React dependencies
        run: make -C react install
      - name: check React application
        run: make -C react check
